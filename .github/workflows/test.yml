name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - if: runner.os != 'Windows'
        run: make check
        shell: bash
      - if: runner.os != 'Windows'
        run: make host-smoke
        shell: bash
      - if: runner.os == 'Windows'
        run: make check && make host-smoke
        shell: msys2 {0}
